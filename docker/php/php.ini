; Configuracion de DESARROLLO. Produccion tendra la suya.

memory_limit = 512M
max_execution_time = 60

; La biblioteca multimedia de la Fase 5 acepta JPG, PNG, SVG y WebP.
; RNF-DAT-007 recomienda 1024x1024 para alta densidad; 20M da margen
; sobrado y sigue siendo un limite, no una puerta abierta.
upload_max_filesize = 20M
post_max_size = 24M
max_file_uploads = 20

; Los errores se ven en desarrollo. En produccion van al log y nunca a la
; respuesta: RNF-GEN-014 y RNF-GEN-015.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; Desactivado en desarrollo para que un cambio en un archivo se vea sin
; reiniciar nada.
opcache.enable = 0
opcache.enable_cli = 0

; El servidor guarda en UTC. La zona de la organizacion se aplica al mostrar,
; nunca al almacenar. RNF-GEN-013.
date.timezone = UTC
