; Ajustes de la aplicacion en produccion.

; Los errores NO se muestran: un mensaje de PHP en pantalla revela rutas del
; servidor, versiones y a veces credenciales. Van al log.
display_errors=Off
log_errors=On
error_log=/dev/stderr

; Las imagenes de la biblioteca admiten hasta 2 MB (MediaPolicy), y una
; peticion puede llevar varias. 12M da margen sin invitar a subir videos.
upload_max_filesize=4M
post_max_size=12M

memory_limit=256M

; 60 segundos: una peticion web que tarda mas es un problema, no una espera.
; Los trabajos largos van a la cola.
max_execution_time=60

; La zona la fija Laravel por organizacion; esto es solo el suelo del sistema.
date.timezone=UTC

; expose_php off: la cabecera X-Powered-By dice la version exacta de PHP, que
; es justo lo que busca quien prueba exploits conocidos.
expose_php=Off
