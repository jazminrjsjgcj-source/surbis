; opcache para produccion.
;
; La diferencia con desarrollo es validate_timestamps: aqui el codigo no
; cambia sin reconstruir la imagen, asi que comprobar la fecha de cada
; archivo en cada peticion es trabajo perdido.
opcache.enable=1
opcache.memory_consumption=192
opcache.interned_strings_buffer=16

; Un proyecto Laravel con vendor pasa de 10.000 archivos con facilidad. Si
; este numero se queda corto, opcache empieza a expulsar archivos y el
; rendimiento cae sin dar ningun aviso.
opcache.max_accelerated_files=20000

opcache.validate_timestamps=0
opcache.save_comments=1
