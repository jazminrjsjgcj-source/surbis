server {
    listen 80;
    server_name _;
    charset utf-8;

    # RNF-GEN-018: solo public/ se expone. Todo lo demas —.env, app/, storage/,
    # vendor/— queda fuera del alcance del servidor web por construccion, no
    # por una regla que alguien tenga que recordar.
    #
    # Esto es comprobable desde el primer dia: http://localhost:8080/.env debe
    # devolver 404, no el archivo.
    root /var/www/html/public;
    index index.php;

    client_max_body_size 24m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # El service worker del quiosco declara scope /kiosk aunque el archivo
    # este en la raiz. Sin esta cabecera el navegador RECHAZA el scope y el
    # registro falla en silencio: no da error visible, simplemente el quiosco
    # no arranca sin red tras un reinicio.
    location = /kiosk-sw.js {
        add_header Service-Worker-Allowed "/kiosk";
        try_files $uri =404;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
    }

    # Niega el acceso a archivos ocultos, salvo /.well-known que hace falta
    # para la emision de certificados.
    # 404 y no 403: un 403 confirma que ahi hay algo. El criterio de cierre
    # de la Fase 0 espera 404 sobre /.env.
    location ~ /\.(?!well-known).* {
        return 404;
    }
}
