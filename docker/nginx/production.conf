# nginx para produccion.
#
# El TLS NO se termina aqui: se asume un proxy delante —el del ayuntamiento—
# que ya lo hace. Duplicar la terminacion TLS obligaria a gestionar
# certificados en dos sitios.

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # El tamano maximo de subida, coherente con php.ini. Si nginx corta
    # antes que PHP, el error que ve el usuario es un 413 sin explicacion.
    client_max_body_size 12M;

    # ---------------------------------------------------------------------
    # Cabeceras de seguridad.
    #
    # always: sin eso, nginx las omite en las respuestas de error, que es
    # justo donde una pagina puede acabar mostrando algo inesperado.
    # ---------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HSTS: el navegador recuerda que este dominio es solo HTTPS. Importa
    # especialmente en el quiosco, donde una tableta en wifi compartido no
    # debe poder caer a HTTP.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---------------------------------------------------------------------
    # El widget se incrusta en OTRAS webs, asi que su iframe necesita poder
    # cargarse desde fuera. Es la unica excepcion a SAMEORIGIN.
    # ---------------------------------------------------------------------
    location ~ ^/e/ {
        add_header X-Frame-Options "" always;
        add_header Content-Security-Policy "frame-ancestors *" always;

        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /widget.js {
        # El widget lo pide cualquier web: sin CORS no se carga.
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600";

        try_files $uri =404;
    }

    location = /kiosk-sw.js {
        # Sin esta cabecera el navegador rechaza el scope /kiosk y el service
        # worker no se registra.
        add_header Service-Worker-Allowed "/kiosk";

        # Y NO se cachea: un service worker viejo serviria una version vieja
        # de la aplicacion durante horas.
        add_header Cache-Control "no-cache";

        try_files $uri =404;
    }

    # Los assets con hash duran para siempre: si cambian, cambia su nombre.
    location /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # El proxy de delante manda el esquema real. Sin esto, Laravel genera
        # URLs http:// detras de un proxy HTTPS y el navegador las bloquea
        # por contenido mixto.
        fastcgi_param HTTPS $http_x_forwarded_proto;
    }

    # Nada de archivos ocultos, salvo .well-known para los certificados.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
