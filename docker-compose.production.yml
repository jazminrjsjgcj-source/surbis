# Produccion.
#
# Se usa asi:
#
#   docker compose -f docker-compose.production.yml up -d
#
# Y NO incluye node ni playwright: en produccion no se compila nada. Los
# assets van dentro de la imagen, construidos en el momento de crearla.
services:
    app:
        image: ${APP_IMAGE:-encuestas:latest}
        restart: unless-stopped

        # El .env NO va dentro de la imagen: una imagen con credenciales
        # dentro no se puede compartir ni guardar en un registro.
        env_file: .env

        volumes:
            # Solo lo que tiene que sobrevivir a un despliegue: las imagenes
            # que sube cada organizacion y los logs.
            - storage:/var/www/html/storage/app
            - ./storage/logs:/var/www/html/storage/logs

        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_started

    web:
        image: nginx:1.27-alpine
        restart: unless-stopped

        # Solo al proxy del ayuntamiento, no a internet: 127.0.0.1 impide que
        # el puerto quede expuesto si el cortafuegos falla.
        ports:
            - '127.0.0.1:8080:80'

        volumes:
            - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro

            # El public de la imagen, para servir assets sin pasar por PHP.
            - public:/var/www/html/public:ro

        depends_on:
            - app

    pgsql:
        image: postgres:17-alpine
        restart: unless-stopped

        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}

        volumes:
            - pgdata:/var/lib/postgresql/data

        # Sin healthcheck, `app` arranca antes de que la base acepte
        # conexiones y las migraciones fallan en cada despliegue.
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}']
            interval: 5s
            timeout: 5s
            retries: 10

        # NO se publica el puerto: la base solo la ve la red de Docker.
        # Publicarla en el servidor del ayuntamiento la dejaria al alcance de
        # cualquiera en la misma red.

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        volumes:
            - redisdata:/data

    # La cola: los correos y los trabajos largos no bloquean una peticion web.
    queue:
        image: ${APP_IMAGE:-encuestas:latest}
        restart: unless-stopped
        env_file: .env
        command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
        volumes:
            - storage:/var/www/html/storage/app
        depends_on:
            - app

    # El programador: RebuildMetrics y la limpieza diaria.
    scheduler:
        image: ${APP_IMAGE:-encuestas:latest}
        restart: unless-stopped
        env_file: .env
        command: php artisan schedule:work
        depends_on:
            - app

volumes:
    pgdata:
    redisdata:
    storage:
    public:
