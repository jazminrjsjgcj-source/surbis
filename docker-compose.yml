# Entorno de desarrollo.
#
# Reproduce la forma de produccion: Nginx delante, PHP-FPM detras, PostgreSQL
# y Redis aparte. No es el camino mas corto —Laravel Sail lo seria— pero es el
# unico que permite comprobar RNF-GEN-018 en desarrollo: que solo public/ se
# expone. Con `php artisan serve` esa regla no se puede verificar hasta el dia
# del despliegue.
#
# Ninguna credencial vive en este archivo. Las variables salen de .env y, si
# faltan, los servicios no arrancan.
#
# Ningun servicio declara `networks`. Compose crea una red por proyecto y mete
# a todos dentro, asi que se llaman entre si por su nombre de servicio: `web`,
# `pgsql`, `redis`. Declarar una red a mano solo hace falta para conectar
# proyectos distintos, y aqui no es el caso.

services:
  app:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: pgsql
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    image: nginx:1.27
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  pgsql:
    image: postgres:17
    ports:
      # Puerto publicado para DBeaver. Si el 5432 del host ya esta ocupado por
      # un PostgreSQL local, cambia FORWARD_DB_PORT en .env en lugar de parar
      # el otro servicio.
      - "${FORWARD_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-encuestas}
      POSTGRES_USER: ${DB_USERNAME:-encuestas}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgsql-data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-encuestas} -d ${DB_DATABASE:-encuestas}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  node:
    image: node:22
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    # Solo se levanta cuando se pide: `docker compose run --rm node npm install`
    profiles:
      - tools

  playwright:
    build:
      context: ./docker/playwright
    # Corre como el usuario del host en lugar de modificar el de la imagen.
    # La imagen ya tiene ocupados el uid 1000 y el gid 1000 por su usuario
    # `node`, asi que usermod no puede reasignarlos a pwuser. Correr como
    # 1000:1000 resuelve los permisos sobre ./e2e sin tocar la imagen.
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /e2e
    volumes:
      - ./e2e:/e2e
    environment:
      # La MISMA url que APP_URL, no el nombre del servicio.
      #
      # Con http://web las pruebas cargaban la pantalla, el POST /login
      # devolvia 302 correctamente... y ahi se paraba todo. El motivo:
      # redirect()->route() construye la URL absoluta con APP_URL, asi que
      # el 302 apuntaba a http://localhost:8080/admin. Desde dentro del
      # contenedor de Playwright, localhost es el propio contenedor: la
      # redireccion iba a una direccion que no existe, el navegador no la
      # seguia, y la URL se quedaba en /login.
      #
      # Costo cinco hipotesis. La evidencia que lo resolvio fue la pestana
      # Network del visor de trazas: POST 302 y NINGUN GET /admin despues.
      E2E_BASE_URL: http://web
    # localhost dentro del contenedor apunta al host, donde el 8080 esta
    # publicado por el servicio web. Sin esto, localhost seria el propio
    # contenedor de Playwright y no habria nada escuchando.
    depends_on:
      - web
    # Como node: no arranca con `docker compose up`. Se invoca con
    # `docker compose run --rm playwright npm test`. Recuerda T-028: con
    # perfil, `exec` no lo encuentra.
    profiles:
      - e2e

volumes:
  pgsql-data:
  redis-data:
